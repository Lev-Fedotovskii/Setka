name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'tests/*browser.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    strategy:
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Restore protected stable signing key
        env:
          KEYSTORE: ${{ secrets.SETKA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/setka-release.jks"
      - name: Build stable signed APK
        env:
          SETKA_KEYSTORE_PATH: ${{ runner.temp }}/setka-release.jks
          SETKA_STORE_PASSWORD: ${{ secrets.SETKA_STORE_PASSWORD }}
          SETKA_KEY_ALIAS: ${{ secrets.SETKA_KEY_ALIAS }}
          SETKA_KEY_PASSWORD: ${{ secrets.SETKA_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Verify stable certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -F "$(cat android/release-certificate.sha256)" "$RUNNER_TEMP/certificate.txt"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device integration checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SETKA_KEYSTORE_PATH: ${{ runner.temp }}/setka-release.jks
          SETKA_STORE_PASSWORD: ${{ secrets.SETKA_STORE_PASSWORD }}
          SETKA_KEY_ALIAS: ${{ secrets.SETKA_KEY_ALIAS }}
          SETKA_KEY_PASSWORD: ${{ secrets.SETKA_KEY_PASSWORD }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && ./gradlew :app:assembleReleaseAndroidTest -PtestBuildType=release --no-daemon
            curl --fail -L https://github.com/Lev-Fedotovskii/Setka/releases/download/v0.3.1/Setka-0.3.1.apk -o /tmp/setka-0.3.apk
            echo '8aa37cddc616ad3a3e2fd8aaf364819e440843a260bb5a855859e4d3176bccbb  /tmp/setka-0.3.apk' | sha256sum --check
            adb install /tmp/setka-0.3.apk
            adb install android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -e class 'io.setka.app.SetkaInstrumentedTest#seedPreviousStable' io.setka.app.release.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/setka-upgrade-seed.txt
            grep -F 'OK (1 test)' /tmp/setka-upgrade-seed.txt
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e class 'io.setka.app.SetkaInstrumentedTest#previousStableDataSurvives' io.setka.app.release.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/setka-upgrade.txt
            grep -F 'OK (1 test)' /tmp/setka-upgrade.txt
            adb shell am instrument -w -e class 'io.setka.app.SetkaInstrumentedTest#systemBarsAndMobileLayouts' io.setka.app.release.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/setka-layout.txt
            grep -F 'OK (1 test)' /tmp/setka-layout.txt
            adb pull /sdcard/Android/data/io.setka.app.release/files/qa /tmp/setka-screens
            adb shell am instrument -w -e class 'io.setka.app.SetkaInstrumentedTest#localImportPlanningPersistenceAndBackgroundNotification' io.setka.app.release.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/setka-native.txt
            grep -F 'OK (1 test)' /tmp/setka-native.txt
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e class 'io.setka.app.SetkaInstrumentedTest#retainedDataAfterReinstall' io.setka.app.release.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/setka-reinstall.txt
            grep -F 'OK (1 test)' /tmp/setka-reinstall.txt
            curl --fail -L https://github.com/Lev-Fedotovskii/Setka/releases/download/v0.2.0/Setka-0.2.0-debug.apk -o /tmp/setka-0.2.apk
            echo 'b15732ab2ed3108058f6df7db4a6e15a0494ee405befb1e70841c7ebbc979d36  /tmp/setka-0.2.apk' | sha256sum --check
            adb install /tmp/setka-0.2.apk
            adb shell pm path io.setka.app
            adb shell pm path io.setka.app.release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            /tmp/setka-native.txt
            /tmp/setka-reinstall.txt
            /tmp/setka-layout.txt
            /tmp/setka-upgrade.txt
            /tmp/setka-screens/
      - uses: actions/upload-artifact@v4
        with:
          name: Setka-Android-APK-${{ matrix.api }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/setka-release.jks"
